services:
  # MySQL
  mysql:
    image: mysql:8.0
    container_name: pastebin-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:${MYSQL_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql

  # Redis
  redis:
    image: redis:alpine
    container_name: pastebin-redis
    restart: always
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: pastebin-minio
    restart: always
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_NOTIFY_REDIS_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_REDIS_ADDRESS_PRIMARY: "${REDIS_HOST}:${REDIS_PORT}"
      MINIO_NOTIFY_REDIS_KEY_PRIMARY: "${REDIS_EVENTS_QUEUE}"
      MINIO_NOTIFY_REDIS_FORMAT_PRIMARY: "access"
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    volumes:
      - minio_data:/data

  # Bucket Initializer & Event Subscription
  create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
      - redis
    entrypoint: >
      /bin/sh -c "
        sleep 3;
        /usr/bin/mc alias set myminio http://${MINIO_HOST}:${MINIO_PORT} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME};
        /usr/bin/mc event add myminio/${MINIO_BUCKET_NAME} arn:minio:sqs::PRIMARY:redis --event put -p;
        exit 0;
      "

  # Isolated upload event worker (Zero public ingress / no exposed ports)
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: pastebin-worker
    restart: always
    depends_on:
      - mysql
      - redis
      - minio
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_QUEUE: ${REDIS_EVENTS_QUEUE}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

volumes:
  mysql_data:
  minio_data:
