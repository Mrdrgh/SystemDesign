
services:
  #My sql
  mysql:
    image: mysql:8.0
    container_name: pastebin-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pastebin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  #redis
  redis:
    image: redis:alpine
    container_name: pastebin-redis
    restart: always
    ports:
      - "6379:6379"
  #minio
  minio:
    image: minio/minio:latest
    container_name: pastebin-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " sleep 3; /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb --ignore-existing myminio/pastebin; exit 0; "
volumes:
  mysql_data:
  minio_data:
