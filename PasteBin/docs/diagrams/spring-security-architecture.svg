<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#18182b" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="inherits" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    </marker>
    <marker id="diamond" viewBox="0 0 16 16" refX="0" refY="8" markerWidth="9" markerHeight="9" orient="auto">
      <polygon points="8,1 15,8 8,15 1,8" fill="#38bdf8" />
    </marker>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="800" fill="url(#headerGrad)" letter-spacing="1">SPRING SECURITY ARCHITECTURE</text>
  <text x="600" y="70" text-anchor="middle" font-size="13" fill="#94a3b8">PasteBin Authentication, Filter Chain, &amp; Principal Resolution Model</text>

  <!-- ==================== LEFT COLUMN: FILTER CHAIN ==================== -->
  <!-- SecurityConfig -->
  <g transform="translate(60, 110)" filter="url(#glow)">
    <rect width="320" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="320" height="30" rx="8" fill="#0284c7" fill-opacity="0.2"/>
    <text x="160" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">SecurityConfig</text>
    <line x1="0" y1="30" x2="320" y2="30" stroke="#334155" stroke-width="1"/>
    <text x="15" y="55" font-size="11" font-family="monospace" fill="#cbd5e1">+securityFilterChain(HttpSecurity): SecurityFilterChain</text>
    <text x="15" y="75" font-size="11" font-family="monospace" fill="#94a3b8">-addFilterBefore(JwtAuthFilter, UsernamePasswordFilter)</text>
  </g>

  <!-- Flow to SecurityFilterChain -->
  <path d="M 220 200 L 220 240" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <rect x="225" y="210" width="55" height="18" rx="4" fill="#0f172a"/>
  <text x="252" y="223" text-anchor="middle" font-size="10" fill="#38bdf8">builds</text>

  <!-- SecurityFilterChain Box -->
  <g transform="translate(60, 245)" filter="url(#glow)">
    <rect width="320" height="80" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <rect width="320" height="28" rx="8" fill="#2563eb" fill-opacity="0.2"/>
    <text x="160" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#93c5fd">SecurityFilterChain</text>
    <line x1="0" y1="28" x2="320" y2="28" stroke="#334155" stroke-width="1"/>
    <text x="15" y="52" font-size="11" font-family="monospace" fill="#cbd5e1">+List&lt;Filter&gt; filters</text>
    <text x="15" y="70" font-size="11" font-family="monospace" fill="#94a3b8">+matches(HttpServletRequest): boolean</text>
  </g>

  <!-- Connections from Filter Chain to Ordered Filters -->
  <path d="M 120 325 L 120 380" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <path d="M 220 325 L 220 380" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <path d="M 320 325 L 320 380" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#diamond)" marker-end="url(#arrow)"/>

  <!-- Filter 0: IpRateLimiterFilter -->
  <g transform="translate(30, 385)" filter="url(#glow)">
    <rect width="160" height="90" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
    <rect width="160" height="24" rx="6" fill="#be123c" fill-opacity="0.25"/>
    <text x="80" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#fda4af">1. IpRateLimiterFilter</text>
    <line x1="0" y1="24" x2="160" y2="24" stroke="#334155" stroke-width="1"/>
    <text x="10" y="44" font-size="10" fill="#cbd5e1">Bucket4j Token Bucket</text>
    <text x="10" y="60" font-size="10" fill="#94a3b8">IP extraction &amp; probe</text>
    <text x="10" y="76" font-size="9" fill="#f43f5e">429 Retry-After</text>
  </g>

  <!-- Filter 1: JwtAuthenticationFilter -->
  <g transform="translate(200, 385)" filter="url(#glow)">
    <rect width="180" height="90" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <rect width="180" height="24" rx="6" fill="#059669" fill-opacity="0.25"/>
    <text x="90" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#6ee7b7">2. JwtAuthFilter</text>
    <line x1="0" y1="24" x2="180" y2="24" stroke="#334155" stroke-width="1"/>
    <text x="10" y="44" font-size="10" fill="#cbd5e1">Extracts 'Bearer' JWT</text>
    <text x="10" y="60" font-size="10" fill="#94a3b8">Validates Claims &amp; User</text>
    <text x="10" y="76" font-size="9" fill="#34d399">Populates SecurityCtx</text>
  </g>

  <!-- Filter 2: AuthorizationFilter -->
  <g transform="translate(390, 385)" filter="url(#glow)">
    <rect width="170" height="90" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
    <rect width="170" height="24" rx="6" fill="#d97706" fill-opacity="0.25"/>
    <text x="85" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#fde68a">3. AuthorizationFilter</text>
    <line x1="0" y1="24" x2="170" y2="24" stroke="#334155" stroke-width="1"/>
    <text x="10" y="44" font-size="10" fill="#cbd5e1">Gatekeeper / Perms</text>
    <text x="10" y="60" font-size="10" fill="#94a3b8">permitAll() vs auth</text>
    <text x="10" y="76" font-size="9" fill="#fbbf24">Checks Authorities</text>
  </g>

  <!-- ==================== CENTER: SECURITY CONTEXT & AUTH ==================== -->
  <!-- Arrow from JwtAuthFilter to SecurityContextHolder -->
  <path d="M 290 475 L 290 560 L 320 560" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-emerald)"/>
  <rect x="235" y="510" width="110" height="18" rx="4" fill="#0f172a"/>
  <text x="290" y="523" text-anchor="middle" font-size="9" fill="#34d399">populates on valid token</text>

  <!-- Arrow from AuthorizationFilter to SecurityContextHolder -->
  <path d="M 475 475 L 475 560 L 580 560" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-amber)"/>
  <rect x="420" y="510" width="110" height="18" rx="4" fill="#0f172a"/>
  <text x="475" y="523" text-anchor="middle" font-size="9" fill="#fbbf24">reads auth to grant/deny</text>

  <!-- SecurityContextHolder -->
  <g transform="translate(320, 560)" filter="url(#glow)">
    <rect width="260" height="100" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <rect width="260" height="30" rx="8" fill="#7c3aed" fill-opacity="0.2"/>
    <text x="130" y="16" text-anchor="middle" font-size="10" fill="#c4b5fd">&lt;&lt;static&gt;&gt;</text>
    <text x="130" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#ddd6fe">SecurityContextHolder</text>
    <line x1="0" y1="30" x2="260" y2="30" stroke="#334155" stroke-width="1"/>
    <text x="15" y="54" font-size="11" font-family="monospace" fill="#cbd5e1">+getContext(): SecurityContext</text>
    <text x="15" y="74" font-size="11" font-family="monospace" fill="#cbd5e1">+setAuthentication(Authentication)</text>
    <text x="15" y="92" font-size="10" font-family="monospace" fill="#94a3b8">ThreadLocal storage</text>
  </g>

  <!-- Arrow from SecurityContextHolder to Authentication -->
  <path d="M 450 660 L 450 710" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <text x="495" y="688" text-anchor="middle" font-size="10" fill="#94a3b8">stores current</text>

  <!-- Authentication Interface -->
  <g transform="translate(320, 715)" filter="url(#glow)">
    <rect width="260" height="120" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <rect width="260" height="30" rx="8" fill="#db2777" fill-opacity="0.2"/>
    <text x="130" y="16" text-anchor="middle" font-size="10" fill="#fbcfe8">&lt;&lt;interface&gt;&gt;</text>
    <text x="130" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#f472b6">Authentication</text>
    <line x1="0" y1="30" x2="260" y2="30" stroke="#334155" stroke-width="1"/>
    <text x="15" y="52" font-size="11" font-family="monospace" fill="#cbd5e1">+getPrincipal(): Object</text>
    <text x="15" y="70" font-size="11" font-family="monospace" fill="#cbd5e1">+getCredentials(): Object</text>
    <text x="15" y="88" font-size="11" font-family="monospace" fill="#cbd5e1">+getAuthorities(): Collection</text>
    <text x="15" y="106" font-size="11" font-family="monospace" fill="#cbd5e1">+isAuthenticated(): boolean</text>
  </g>

  <!-- UsernamePasswordAuthenticationToken -->
  <g transform="translate(30, 725)" filter="url(#glow)">
    <rect width="240" height="90" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <rect width="240" height="26" rx="8" fill="#db2777" fill-opacity="0.2"/>
    <text x="120" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#fbcfe8">UsernamePasswordAuthToken</text>
    <line x1="0" y1="26" x2="240" y2="26" stroke="#334155" stroke-width="1"/>
    <text x="12" y="48" font-size="10" font-family="monospace" fill="#cbd5e1">+principal: User (UserDetails)</text>
    <text x="12" y="66" font-size="10" font-family="monospace" fill="#cbd5e1">+credentials: null / password</text>
    <text x="12" y="82" font-size="10" font-family="monospace" fill="#cbd5e1">+authorities: [ROLE_USER]</text>
  </g>

  <!-- Arrow implementing Authentication -->
  <path d="M 270 770 L 320 770" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#inherits)"/>
  <text x="295" y="760" text-anchor="middle" font-size="9" fill="#818cf8">implements</text>

  <!-- ==================== RIGHT COLUMN: AUTH MANAGER & DAO PROVIDER ==================== -->
  <!-- AuthenticationManager Interface -->
  <g transform="translate(740, 110)" filter="url(#glow)">
    <rect width="380" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="380" height="28" rx="8" fill="#0284c7" fill-opacity="0.2"/>
    <text x="190" y="15" text-anchor="middle" font-size="10" fill="#7dd3fc">&lt;&lt;interface&gt;&gt;</text>
    <text x="190" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#38bdf8">AuthenticationManager</text>
    <line x1="0" y1="28" x2="380" y2="28" stroke="#334155" stroke-width="1"/>
    <text x="15" y="55" font-size="11" font-family="monospace" fill="#cbd5e1">+authenticate(Authentication): Authentication</text>
  </g>

  <!-- Implemented by ProviderManager -->
  <path d="M 930 230 L 930 190" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#inherits)"/>
  <text x="965" y="215" text-anchor="middle" font-size="9" fill="#818cf8">implements</text>

  <!-- ProviderManager -->
  <g transform="translate(740, 230)" filter="url(#glow)">
    <rect width="380" height="90" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="380" height="28" rx="8" fill="#4f46e5" fill-opacity="0.2"/>
    <text x="190" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#c7d2fe">ProviderManager</text>
    <line x1="0" y1="28" x2="380" y2="28" stroke="#334155" stroke-width="1"/>
    <text x="15" y="52" font-size="11" font-family="monospace" fill="#cbd5e1">+List&lt;AuthenticationProvider&gt; providers</text>
    <text x="15" y="72" font-size="11" font-family="monospace" fill="#cbd5e1">+authenticate(Authentication): Authentication</text>
  </g>

  <!-- Delegates to AuthenticationProvider -->
  <path d="M 930 320 L 930 365" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <text x="975" y="348" text-anchor="middle" font-size="10" fill="#94a3b8">delegates to</text>

  <!-- AuthenticationProvider Interface -->
  <g transform="translate(740, 370)" filter="url(#glow)">
    <rect width="380" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="380" height="28" rx="8" fill="#0284c7" fill-opacity="0.2"/>
    <text x="190" y="15" text-anchor="middle" font-size="10" fill="#7dd3fc">&lt;&lt;interface&gt;&gt;</text>
    <text x="190" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#38bdf8">AuthenticationProvider</text>
    <line x1="0" y1="28" x2="380" y2="28" stroke="#334155" stroke-width="1"/>
    <text x="15" y="52" font-size="11" font-family="monospace" fill="#cbd5e1">+authenticate(Authentication): Authentication</text>
    <text x="15" y="72" font-size="11" font-family="monospace" fill="#cbd5e1">+supports(Class&lt;?&gt;): boolean</text>
  </g>

  <!-- Implemented by DaoAuthenticationProvider -->
  <path d="M 930 500 L 930 460" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#inherits)"/>
  <text x="965" y="485" text-anchor="middle" font-size="9" fill="#818cf8">implements</text>

  <!-- DaoAuthenticationProvider -->
  <g transform="translate(740, 500)" filter="url(#glow)">
    <rect width="380" height="95" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <rect width="380" height="28" rx="8" fill="#16a34a" fill-opacity="0.2"/>
    <text x="190" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#bbf7d0">DaoAuthenticationProvider</text>
    <line x1="0" y1="28" x2="380" y2="28" stroke="#334155" stroke-width="1"/>
    <text x="15" y="52" font-size="11" font-family="monospace" fill="#cbd5e1">+authenticate(Authentication): Authentication</text>
    <text x="15" y="70" font-size="10" fill="#94a3b8">Loads user by username via UserDetailsService</text>
    <text x="15" y="86" font-size="10" fill="#94a3b8">Matches hashed passwords via PasswordEncoder</text>
  </g>

  <!-- Branching from DaoAuthenticationProvider -->
  <path d="M 830 595 L 830 655" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="790" y="630" text-anchor="middle" font-size="9" fill="#38bdf8">loads user via</text>

  <path d="M 1030 595 L 1030 655" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="1075" y="630" text-anchor="middle" font-size="9" fill="#38bdf8">verifies hash via</text>

  <!-- UserDetailsService Interface -->
  <g transform="translate(680, 660)" filter="url(#glow)">
    <rect width="250" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
    <rect width="250" height="24" rx="8" fill="#0284c7" fill-opacity="0.2"/>
    <text x="125" y="16" text-anchor="middle" font-size="10" fill="#7dd3fc">&lt;&lt;interface&gt;&gt; UserDetailsService</text>
    <line x1="0" y1="24" x2="250" y2="24" stroke="#334155" stroke-width="1"/>
    <text x="10" y="48" font-size="10" font-family="monospace" fill="#cbd5e1">+loadUserByUsername(String): UserDetails</text>
  </g>

  <!-- PasswordEncoder Interface -->
  <g transform="translate(950, 660)" filter="url(#glow)">
    <rect width="220" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.3"/>
    <rect width="220" height="24" rx="8" fill="#d97706" fill-opacity="0.2"/>
    <text x="110" y="16" text-anchor="middle" font-size="10" fill="#fde68a">&lt;&lt;interface&gt;&gt; PasswordEncoder</text>
    <line x1="0" y1="24" x2="220" y2="24" stroke="#334155" stroke-width="1"/>
    <text x="10" y="44" font-size="10" font-family="monospace" fill="#cbd5e1">+encode(raw): String</text>
    <text x="10" y="60" font-size="10" font-family="monospace" fill="#cbd5e1">+matches(raw, hash): boolean</text>
  </g>

  <!-- UserDetailsService returns UserDetails -->
  <path d="M 805 730 L 805 765" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="830" y="750" text-anchor="start" font-size="9" fill="#38bdf8">returns</text>

  <!-- UserDetails Interface & User Entity -->
  <g transform="translate(680, 770)" filter="url(#glow)">
    <rect width="250" height="105" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.3"/>
    <rect width="250" height="24" rx="8" fill="#059669" fill-opacity="0.2"/>
    <text x="125" y="16" text-anchor="middle" font-size="10" fill="#a7f3d0">&lt;&lt;interface&gt;&gt; UserDetails</text>
    <line x1="0" y1="24" x2="250" y2="24" stroke="#334155" stroke-width="1"/>
    <text x="10" y="44" font-size="10" font-family="monospace" fill="#cbd5e1">+getUsername() / +getPassword()</text>
    <text x="10" y="60" font-size="10" font-family="monospace" fill="#cbd5e1">+getAuthorities(): Collection</text>
    <text x="10" y="78" font-size="10" font-weight="700" fill="#6ee7b7">&#9650; Implemented by User Entity</text>
    <text x="10" y="94" font-size="9" fill="#94a3b8">(id, username, email, password, role)</text>
  </g>

  <!-- BCryptPasswordEncoder Box -->
  <g transform="translate(950, 770)" filter="url(#glow)">
    <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.3"/>
    <rect width="220" height="22" rx="8" fill="#b45309" fill-opacity="0.2"/>
    <text x="110" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#fde68a">BCryptPasswordEncoder</text>
    <line x1="0" y1="22" x2="220" y2="22" stroke="#334155" stroke-width="1"/>
    <text x="10" y="42" font-size="10" font-family="monospace" fill="#cbd5e1">10 rounds salt hashing</text>
    <text x="10" y="55" font-size="9" fill="#94a3b8">Spring Security Bean</text>
  </g>
  <path d="M 1060 730 L 1060 770" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#inherits)"/>
</svg>
